[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maxmin-fairness-rl"
version = "0.1.0"
description = "Deep RL for max-min fairness over any constrained optimisation problem: hybrid SAC-DDPG actor, in-graph projected-delta actions, composite log-ratio reward."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ayush Brijesh Patel" }]
keywords = ["reinforcement-learning", "fairness", "max-min", "soft-actor-critic", "ddpg", "constrained-optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Ayush010104/maxmin-fairness-rl"
"Project page" = "https://ayush010104.github.io/sim-maxmin-fairness-drl/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
